<h2>The Voices</h2>
<p>Aplicación de barra de menús que procesa tu voz en tiempo real (voz mejorada, personajes y autotune) y la envía a <b>BlackHole 2ch</b>, para usarla como micrófono en Zoom, Meet o para grabar.</p>
<p>Se instalará en <b>/Applications</b>. Requiere macOS 15 o superior en un Mac con Apple silicon.</p>
